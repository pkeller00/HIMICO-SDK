[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "himico-sdk"
version = "0.3.1"
description = "HIMICO SDK: run HIMICO computational pathology models (INSIGHT, SPARROW, ...) on whole-slide image cohorts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY-NC-ND 4.0" }
authors = [{ name = "Piotr Keller", email = "Piotr.Keller@warwick.ac.uk" }]
keywords = ["computational pathology", "whole slide images", "survival", "graph neural networks", "colorectal cancer", "HIMICO"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pillow>=10",
  "pyyaml>=6",
  "tqdm>=4.66",
  "torch>=2.5",
  "torchvision>=0.20",
  "timm>=1.0",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
  "segmentation-models-pytorch>=0.3.3",
  "torch_geometric>=2.5",
  "tiatoolbox>=1.6",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tifffile>=2024.1"]
viewer = ["bokeh>=3.3", "flask>=3", "flask-cors>=4"]

[project.scripts]
himico = "himico.cli:main"
insight = "himico.cli:main"      # alias kept for scripts written for the INSIGHT SDK

[project.entry-points."himico.models"]
insight-crc = "himico.models.insight_crc:InsightCRC"

[project.urls]
Homepage = "https://github.com/pkeller00/HIMICO-SDK"
INSIGHT = "https://github.com/pkeller00/INSIGHT"
"INSIGHT paper" = "https://arxiv.org/abs/2512.22262"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Qhull licence terms require COPYING.txt to travel with every copy
"himico._qhull" = ["COPYING.txt", "README.md", "README.scipy"]
