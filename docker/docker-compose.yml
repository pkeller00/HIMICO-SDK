# Host HIMICO models with `himico serve` (GPU), for groups that hold the model weights. Users run the pipeline on
# their own data and use
#   himico login --server http://<this-host>:8080 && himico run ... --backend http://<this-host>:8080
#
#   himico keys add "Jane Doe, Uni X" --tier academic --file server/keys.json   # issue keys (only hashes stored)
#   export HIMICO_WEIGHTS=/secure/weights                                       # insight/fold{1..4}/...
#   docker compose -f docker/docker-compose.yml up -d
services:
  himico-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: himico:gpu
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--keys", "/srv/keys.json",
              "--weights-dir", "/weights", "--preload", "insight-crc"]
    ports:
      - "8080:8080"           # put a TLS reverse proxy in front if this is reachable beyond your network
    volumes:
      - ../server:/srv:ro
      - ${HIMICO_WEIGHTS:?set HIMICO_WEIGHTS to the folder with the model weights}:/weights:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
